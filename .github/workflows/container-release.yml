name: DermCareAI Container Release

on:
  push:
    tags:
      - "v5.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dermcareai-one-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/dermcareai-one-backend:${{ github.sha }}
          provenance: true
          sbom: true
