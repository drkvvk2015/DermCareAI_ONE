name: DermCareAI Temporary Mobile Lock Refresh

on:
  push:
    branches:
      - swarm/final-hardening-integrated-v4

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dermcareai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dermcareai/package-lock.json
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit refreshed lockfile
        env:
          BRANCH: swarm/final-hardening-integrated-v4
        run: |
          git config user.name "DermCareAI CI"
          git config user.email "dermcareai-ci@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(mobile): refresh Expo lockfile [skip ci]"
          git push origin "$BRANCH"
