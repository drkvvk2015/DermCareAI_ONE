name: DermCareAI Continuous Evaluation

on:
  push:
    branches: [main, ai-autoeval-selfheal-v2, pr2-recovery-hardening]
  pull_request:
    branches: [main, pr2-recovery-hardening]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  backend-static-and-safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pytest fastapi pydantic httpx firebase-admin SQLAlchemy 'psycopg[binary]' python-multipart Pillow opencv-python-headless numpy
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run safety and metric tests
        run: pytest -q tests
      - name: Validate required model files are not committed
        shell: bash
        run: |
          if find . -maxdepth 3 -type f \( -name '*.pth' -o -name '*.keras' -o -name '*.h5' \) | grep -q .; then
            echo 'Model binaries must be provided through controlled deployment storage, not committed to Git.'
            exit 1
          fi

  pwa-capacitor-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install locked web/PWA dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc -b
      - name: Web lint
        run: npm run lint
      - name: Web tests
        run: npm run test -- --run
      - name: Production PWA build
        run: npm run build
      - name: Generate Capacitor Android project
        run: npx cap add android
      - name: Validate Capacitor Android sync
        run: npx cap sync android
