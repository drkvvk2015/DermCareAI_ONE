name: DermCareAI Continuous Evaluation

on:
  push:
    branches:
      - main
      - ai-autoeval-selfheal-v2
      - pr2-recovery-hardening
      - pr3-ai-suite
      - pr3-commerce-billing
      - pr3-pharmacy
      - pr3-security-rbac-audit
      - pr3-mobile-notifications
  pull_request:
    branches:
      - main
      - pr2-recovery-hardening
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  backend-static-and-safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip pytest fastapi pydantic httpx firebase-admin
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run backend regression suite
        run: pytest -q tests
      - name: Validate required model files are not committed
        shell: bash
        run: |
          if find . -maxdepth 3 -type f \( -name '*.pth' -o -name '*.keras' -o -name '*.h5' \) | grep -q .; then
            echo 'Model binaries must be provided through controlled deployment storage, not committed to Git.'
            exit 1
          fi

  mobile-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dermcareai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dermcareai/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript / Expo export check
        run: npx tsc --noEmit
      - name: Expo export smoke test
        run: npx expo export --platform web
