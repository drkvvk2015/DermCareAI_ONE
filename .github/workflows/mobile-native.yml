name: DermCareAI Native Android Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-build:
    name: Expo prebuild + Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dermcareai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dermcareai/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run Expo diagnostics
        run: npx expo-doctor

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Build Android debug APK
        working-directory: dermcareai/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dermcareai-debug-apk
          path: dermcareai/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
