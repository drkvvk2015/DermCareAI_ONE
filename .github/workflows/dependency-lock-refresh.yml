name: DermCareAI Dependency Lock Refresh

on:
  push:
    branches:
      - fix/production-completion-2026-11-06
  workflow_dispatch:
  schedule:
    - cron: "10 3 * * *"

# The default token is read-only. A repository-installed GitHub App token is
# used only when configured, so published lockfile updates trigger normal PR CI.
permissions:
  contents: read

concurrency:
  group: dependency-lock-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-and-audit:
    # Only run on the two explicitly trusted refs: scheduled/manual runs on
    # main, and the dedicated repair-branch push trigger. Manual dispatches
    # from feature refs are skipped before any repository code or secrets run.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/fix/production-completion-2026-11-06') ||
      ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      # APP_ID is non-secret and is used only to decide whether token creation
      # is configured. The private key is passed only to the token action below.
      APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"

      - name: Refresh npm lockfile from patched semver-compatible releases
        working-directory: webapp
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true

      - name: Regenerate hash-locked Python runtime dependencies
        run: uv pip compile backend/requirements.txt --upgrade --python-version 3.12 --universal --generate-hashes --output-file backend/requirements.lock

      - name: Regenerate hash-locked Python CI dependencies
        run: uv pip compile backend/requirements-ci.in --upgrade --python-version 3.12 --universal --generate-hashes --output-file backend/requirements-ci.lock

      - name: Install candidate frontend dependencies
        working-directory: webapp
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify candidate frontend
        working-directory: webapp
        run: |
          npm run lint
          npm run test -- --run
          npm run build

      - name: Install candidate backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements-ci.lock

      - name: Verify candidate backend
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q .
          pytest -q tests

      - name: Install the audit tool
        run: python -m pip install --disable-pip-version-check pip-audit

      - name: Generate npm audit evidence
        shell: bash
        run: |
          cd webapp
          npm audit --json > ../npm-audit-webapp.json || true

      - name: Generate Python runtime and CI audit evidence
        shell: bash
        run: |
          pip-audit -r backend/requirements.lock --format=json > pip-audit-runtime.json || true
          pip-audit -r backend/requirements-ci.lock --format=json > pip-audit-ci.json || true

      - name: Enforce dependency audit policy
        run: |
          python backend/scripts/enforce_dependency_audit.py \
            --webapp npm-audit-webapp.json \
            --python-runtime pip-audit-runtime.json \
            --python-ci pip-audit-ci.json \
            --exceptions security/dependency-audit-exceptions.json

      # Audit and tests run before any publication so they inspect the exact
      # candidate dependency graph that will be proposed.

      - name: Create scoped GitHub App token
        id: app-token
        if: ${{ env.APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name || 'DermCareAI_ONE' }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit and publish refreshed locks from repair-branch pushes
        if: ${{ github.event_name == 'push' && steps.app-token.outputs.token != '' }}
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git add webapp/package-lock.json backend/requirements.lock backend/requirements-ci.lock
          if git diff --cached --quiet; then
            echo "No dependency lock changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): refresh audited dependency lockfiles"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Open a dependency refresh PR for scheduled/manual runs
        if: ${{ github.event_name != 'push' && steps.app-token.outputs.token != '' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/dependency-lock-refresh
          base: main
          delete-branch: false
          commit-message: "chore(deps): refresh audited dependency lockfiles"
          title: "chore(deps): refresh audited dependency lockfiles"
          body: |
            Automated dependency lock refresh generated from the repository's pinned security floors.

            Candidate frontend/backend tests and dependency audits run before publication. Standard pull-request CI remains a required merge gate.
          add-paths: |
            webapp/package-lock.json
            backend/requirements.lock
            backend/requirements-ci.lock

      - name: Explain publication was skipped without GitHub App credentials
        if: ${{ steps.app-token.outputs.token == '' }}
        run: echo "::warning::Candidate locks were verified and uploaded, but automatic publishing is disabled. Configure APP_ID and APP_PRIVATE_KEY repository secrets for a GitHub App installed with Contents and Pull requests write permission."

      - name: Upload candidate lockfiles and audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dermcareai-dependency-lock-refresh-audit
          if-no-files-found: warn
          path: |
            webapp/package-lock.json
            backend/requirements.lock
            backend/requirements-ci.lock
            npm-audit-webapp.json
            pip-audit-runtime.json
            pip-audit-ci.json
