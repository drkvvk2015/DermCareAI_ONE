name: DermCareAI Dependency Lock Refresh

on:
  push:
    branches:
      - fix/production-completion-2026-11-06
  workflow_dispatch:
  schedule:
    - cron: "10 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-lock-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"

      - name: Refresh npm lockfile from patched semver-compatible releases
        working-directory: webapp
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true

      - name: Regenerate hash-locked Python runtime dependencies
        run: uv pip compile backend/requirements.txt --python-version 3.12 --universal --generate-hashes --output-file backend/requirements.lock

      - name: Regenerate hash-locked Python CI dependencies
        run: uv pip compile backend/requirements-ci.in --python-version 3.12 --universal --generate-hashes --output-file backend/requirements-ci.lock

      - name: Commit lock refresh to the repair branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          git add webapp/package-lock.json backend/requirements.lock backend/requirements-ci.lock
          if git diff --cached --quiet; then
            echo "No dependency lock changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): refresh audited dependency lockfiles"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Open a dependency refresh PR for scheduled/manual runs
        if: github.event_name != 'push'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/dependency-lock-refresh
          delete-branch: false
          commit-message: "chore(deps): refresh audited dependency lockfiles"
          title: "chore(deps): refresh audited dependency lockfiles"
          body: |
            Automated dependency lock refresh generated from the repository's pinned security floors.

            This PR must pass dependency audit, backend regression, PWA lint/tests/build, and the Android/iOS Capacitor validation gates before merge.
          add-paths: |
            webapp/package-lock.json
            backend/requirements.lock
            backend/requirements-ci.lock

      - name: Install the audit tool
        run: python -m pip install --disable-pip-version-check pip-audit

      - name: Generate npm audit evidence
        shell: bash
        run: |
          cd webapp
          npm audit --json > ../npm-audit-webapp.json || true

      - name: Generate Python runtime and CI audit evidence
        shell: bash
        run: |
          pip-audit -r backend/requirements.lock --format=json > pip-audit-runtime.json || true
          pip-audit -r backend/requirements-ci.lock --format=json > pip-audit-ci.json || true

      - name: Enforce dependency audit policy
        run: |
          python backend/scripts/enforce_dependency_audit.py \
            --webapp npm-audit-webapp.json \
            --python-runtime pip-audit-runtime.json \
            --python-ci pip-audit-ci.json \
            --exceptions security/dependency-audit-exceptions.json

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dermcareai-dependency-lock-refresh-audit
          if-no-files-found: warn
          path: |
            npm-audit-webapp.json
            pip-audit-runtime.json
            pip-audit-ci.json
