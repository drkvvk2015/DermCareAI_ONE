name: DermCareAI Runner Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Runner identity
        run: |
          set -eux
          echo "runner=$RUNNER_NAME"
          echo "os=$RUNNER_OS"
          echo "arch=$RUNNER_ARCH"
          uname -a
          node --version || true
          python3 --version
