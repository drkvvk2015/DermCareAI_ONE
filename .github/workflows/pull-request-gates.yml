name: DermCareAI Pull Request Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Compile backend
        run: python -m compileall -q .
      - name: Run regression tests
        run: pytest -q tests
      - name: Reject committed model binaries
        shell: bash
        run: |
          if find . -maxdepth 3 -type f \( -name '*.pth' -o -name '*.keras' -o -name '*.h5' \) | grep -q .; then
            echo 'Model binaries must not be committed to the repository.'
            exit 1
          fi

  pwa-capacitor-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install web/PWA dependencies and refresh lockfile
        run: npm install --no-audit --no-fund
      - name: Upload generated lockfile for migration validation
        uses: actions/upload-artifact@v7
        with:
          name: pwa-capacitor-package-lock
          path: webapp/package-lock.json
          if-no-files-found: error
      - name: TypeScript check
        run: npx tsc -b
      - name: Web lint
        run: npm run lint
      - name: Web tests
        run: npm run test -- --run
      - name: Production PWA build
        run: npm run build
      - name: Generate Capacitor Android project
        run: npx cap add android
      - name: Validate Capacitor Android sync
        run: npx cap sync android

  web-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dashboard dependencies
        run: npm install --no-audit --no-fund
      - name: Dashboard lint
        run: npm run lint
      - name: Dashboard build
        run: npm run build
      - name: Dashboard tests
        run: npm run test -- --run
