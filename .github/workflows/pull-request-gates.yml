name: Pull Request Gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synchronize-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Generate authoritative web lockfile
        working-directory: webapp
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Fail on lockfile drift
        shell: bash
        run: |
          if ! git diff --quiet -- webapp/package-lock.json backend/requirements-ci.lock; then
            echo 'Authoritative lockfiles are out of sync. Regenerate and commit them before opening the PR.'
            git diff -- webapp/package-lock.json backend/requirements-ci.lock
            exit 1
          fi

  backend-regression:
    needs: synchronize-lockfiles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Compile backend
        run: python -m compileall -q .
      - name: Run regression tests
        run: pytest -q tests
      - name: Reject committed model binaries
        shell: bash
        run: |
          if find . -maxdepth 3 -type f \( -name '*.pth' -o -name '*.keras' -o -name '*.h5' \) | grep -q .; then
            echo 'Model binaries must not be committed to the repository.'
            exit 1
          fi

  pwa-capacitor-regression:
    needs: synchronize-lockfiles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install locked web/PWA dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc -b
      - name: Web lint
        run: npm run lint
      - name: Web tests
        run: npm run test -- --run
      - name: Production PWA build
        run: npm run build
      - name: Generate Capacitor Android project
        run: npx cap add android
      - name: Validate Capacitor Android sync
        run: npx cap sync android
      - name: Validate no active Expo or React Native package references
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          if git grep -nEi '(^|[^A-Za-z])(expo|@expo|react-native)([^A-Za-z]|$)' -- webapp ':!webapp/package-lock.json' 2>/dev/null; then
            echo 'Active Expo/React Native references remain in the production PWA source tree.'
            exit 1
          fi

  capacitor-ios-regression:
    needs: synchronize-lockfiles
    runs-on: macos-14
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install locked web/PWA dependencies
        run: npm ci --no-audit --no-fund
      - name: Production PWA build
        run: npm run build
      - name: Generate Capacitor iOS project
        run: npx cap add ios
      - name: Validate Capacitor iOS sync
        run: npx cap sync ios

  web-dashboard:
    needs: synchronize-lockfiles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install locked dashboard dependencies
        run: npm ci --no-audit --no-fund
      - name: Dashboard lint
        run: npm run lint
      - name: Dashboard build
        run: npm run build
      - name: Dashboard tests
        run: npm run test -- --run
