name: DermCareAI Pull Request Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Compile backend
        run: python -m compileall -q .
      - name: Run regression tests
        run: pytest -q tests
      - name: Reject committed model binaries
        shell: bash
        run: |
          if find . -maxdepth 3 -type f \( -name '*.pth' -o -name '*.keras' -o -name '*.h5' \) | grep -q .; then
            echo 'Model binaries must not be committed to the repository.'
            exit 1
          fi

  pwa-capacitor-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install web/PWA dependencies and refresh lockfile
        run: npm install --no-audit --no-fund
      - name: Commit authoritative generated lockfile to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- webapp/package-lock.json; then
            echo 'package-lock.json is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webapp/package-lock.json
          git commit -m 'build: synchronize PWA Capacitor lockfile [skip ci]'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: TypeScript check
        run: npx tsc -b
      - name: Web lint
        run: npm run lint
      - name: Web tests
        run: npm run test -- --run
      - name: Production PWA build
        run: npm run build
      - name: Generate Capacitor Android project
        run: npx cap add android
      - name: Validate Capacitor Android sync
        run: npx cap sync android
      - name: Validate no active Expo or React Native deployment references
        working-directory: .
        shell: bash
        run: |
          if git grep -nEi '(^|[^A-Za-z])(expo|@expo|react-native)([^A-Za-z]|$)' -- .github webapp package.json package-lock.json 2>/dev/null; then
            echo 'Active Expo/React Native references remain in application or CI configuration.'
            exit 1
          fi

  capacitor-ios-regression:
    runs-on: macos-14
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install web/PWA dependencies
        run: npm install --no-audit --no-fund
      - name: Production PWA build
        run: npm run build
      - name: Generate Capacitor iOS project
        run: npx cap add ios
      - name: Validate Capacitor iOS sync
        run: npx cap sync ios

  web-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dashboard dependencies
        run: npm install --no-audit --no-fund
      - name: Dashboard lint
        run: npm run lint
      - name: Dashboard build
        run: npm run build
      - name: Dashboard tests
        run: npm run test -- --run
