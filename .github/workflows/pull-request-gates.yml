name: DermCareAI Pull Request Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest fastapi pydantic httpx firebase-admin SQLAlchemy 'psycopg[binary]' python-multipart Pillow opencv-python-headless numpy
      - name: Compile backend
        run: python -m compileall -q .
      - name: Run regression tests
        run: pytest -q tests
      - name: Reject committed model binaries
        shell: bash
        run: |
          if find . -maxdepth 3 -type f \( -name '*.pth' -o -name '*.keras' -o -name '*.h5' \) | grep -q .; then
            echo 'Model binaries must not be committed to the repository.'
            exit 1
          fi

  mobile-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dermcareai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dermcareai/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Expo web export smoke test
        run: npx expo export --platform web
      - name: Validate Expo project
        run: npx expo-doctor
      - name: Validate native project generation
        run: npx expo prebuild --no-install --non-interactive
