name: DermCareAI Pull Request Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest fastapi pydantic httpx firebase-admin SQLAlchemy 'psycopg[binary]' python-multipart Pillow opencv-python-headless numpy
      - name: Compile backend
        run: python -m compileall -q .
      - name: Run regression tests
        run: pytest -q tests
      - name: Reject committed model binaries
        shell: bash
        run: |
          if find . -maxdepth 3 -type f \( -name '*.pth' -o -name '*.keras' -o -name '*.h5' \) | grep -q .; then
            echo 'Model binaries must not be committed to the repository.'
            exit 1
          fi

  mobile-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dermcareai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dermcareai/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Expo web export smoke test
        run: npx expo export --platform web
      - name: Validate Expo project
        run: npx expo-doctor
      - name: Validate native project generation
        run: npx expo prebuild --no-install --non-interactive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Android debug APK
        run: cd android && ./gradlew :app:assembleDebug
      - name: Validate Android APK metadata and installability assumptions
        shell: bash
        run: |
          android_sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          aapt="$(find "$android_sdk/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$android_sdk/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          node scripts/validate-android-apk.cjs \
            --apk android/app/build/outputs/apk/debug/app-debug.apk \
            --aapt "$aapt" \
            --apksigner "$apksigner"
      - name: Run Android APK validator tests
        run: node --test tests/android-artifact.test.cjs
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dermcareai-android-debug-apk
          path: dermcareai/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
