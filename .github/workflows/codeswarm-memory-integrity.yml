name: CodeSwarm Memory Integrity

on:
  pull_request:
    paths:
      - ".codeswarm/memory/**"
      - ".codeswarm/tools/**"
      - ".codeswarm/tests/**"
      - ".github/agents/CodeSwarm*.agent.md"
      - ".github/workflows/codeswarm-memory-integrity.yml"
  push:
    branches:
      - main
    paths:
      - ".codeswarm/memory/**"
      - ".codeswarm/tools/**"
      - ".codeswarm/tests/**"
      - ".github/agents/CodeSwarm*.agent.md"
      - ".github/workflows/codeswarm-memory-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeswarm-memory-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-memory:
    name: Validate CodeSwarm memory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run memory validator tests
        run: python -B -m unittest discover -s .codeswarm/tests -p "test_*.py" -v

      - name: Validate active memory
        run: python -B .codeswarm/tools/validate_memory.py --format json
