name: DermCareAI Production Preflight Contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-preflight-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .:scripts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Validate production preflight contract
        run: pytest -q tests/test_production_preflight.py tests/test_ai_production_gate.py
      - name: Verify optional AI evidence manifest when supplied
        run: |
          if [ -f ../docs/ai-validation/release-manifest.json ]; then
            python scripts/validate_ai_release_manifest.py ../docs/ai-validation/release-manifest.json
          else
            echo 'Clinical AI evidence manifest absent: production clinical AI remains disabled by policy.'
          fi
