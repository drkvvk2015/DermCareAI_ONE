name: DermCareAI Temporary NPM Lock Refresh

on:
  push:
    branches:
      - hardening/production-readiness-2026-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dermcareai
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dermcareai/package-lock.json
      - name: Refresh lockfile without scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v7
        with:
          name: dermcareai-refreshed-lock
          path: dermcareai/package-lock.json
