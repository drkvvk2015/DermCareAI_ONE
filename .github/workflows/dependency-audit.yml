name: DermCareAI Dependency Audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            dermcareai/package-lock.json
            webapp/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked Python audit tools
        run: python -m pip install --require-hashes -r backend/requirements-ci.lock
      - name: Audit locked application dependencies
        shell: bash
        run: |
          set +e
          (cd dermcareai && npm audit --json > ../npm-audit-mobile.json)
          (cd webapp && npm audit --json > ../npm-audit-webapp.json)
          pip-audit -r backend/requirements.lock --format=json > pip-audit-runtime.json
          pip-audit -r backend/requirements-ci.lock --format=json > pip-audit-ci.json
          set -e
          python backend/scripts/enforce_dependency_audit.py \
            --mobile npm-audit-mobile.json \
            --webapp npm-audit-webapp.json \
            --python-runtime pip-audit-runtime.json \
            --python-ci pip-audit-ci.json
      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dermcareai-dependency-audit
          if-no-files-found: warn
          path: |
            npm-audit-mobile.json
            npm-audit-webapp.json
            pip-audit-runtime.json
            pip-audit-ci.json
