name: DermCareAI Dependency Audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dermcareai/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python audit and lock tools
        run: python -m pip install --upgrade pip pip-audit pip-tools
      - name: Audit npm dependencies
        working-directory: dermcareai
        run: npm audit --audit-level=high --json > ../npm-audit.json
      - name: Resolve reproducible Python lock
        working-directory: backend
        run: pip-compile requirements.txt --output-file requirements.lock --generate-hashes --strip-extras
      - name: Audit resolved Python dependencies
        working-directory: backend
        run: pip-audit -r requirements.lock --format json > ../pip-audit.json
      - name: Generate dependency status summary
        run: |
          python - <<'PY'
          from pathlib import Path
          out = []
          for path in (Path("npm-audit.json"), Path("pip-audit.json"), Path("backend/requirements.lock")):
              if path.exists():
                  out.append(f"Generated {path}")
          Path("dependency-audit-summary.txt").write_text("\n".join(out) + "\n")
          PY
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: dermcareai-dependency-audit
          path: |
            npm-audit.json
            pip-audit.json
            backend/requirements.lock
            dependency-audit-summary.txt
