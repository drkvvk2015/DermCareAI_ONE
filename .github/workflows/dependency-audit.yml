name: DermCareAI Dependency Audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dermcareai/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Generate npm audit report
        working-directory: dermcareai
        run: |
          set +e
          npm audit --json > ../npm-audit.json
          echo "$?" > ../npm-audit.exitcode
      - name: Generate Python audit report
        working-directory: backend
        run: |
          set +e
          pip-audit -r requirements.txt --format json > ../pip-audit.json
          echo "$?" > ../pip-audit.exitcode
      - name: Enforce dependency release gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failures = []

          npm_path = Path("npm-audit.json")
          if npm_path.exists():
              try:
                  npm = json.loads(npm_path.read_text())
                  vulnerabilities = npm.get("vulnerabilities")
                  if not isinstance(vulnerabilities, dict):
                      failures.append("npm audit did not return a vulnerability map")
                  else:
                      severe = []
                      for name, item in vulnerabilities.items():
                          severity = str(item.get("severity", "")).lower()
                          if severity in {"high", "critical"}:
                              severe.append(f"{name}:{severity}")
                      if severe:
                          failures.append(
                              "npm high/critical findings: " + ", ".join(sorted(severe))
                          )
              except json.JSONDecodeError as exc:
                  failures.append(f"npm audit JSON could not be parsed: {exc}")
          else:
              failures.append("npm audit report is missing")

          pip_path = Path("pip-audit.json")
          if pip_path.exists():
              try:
                  pip = json.loads(pip_path.read_text())
                  dependencies = pip.get("dependencies")
                  if not isinstance(dependencies, list):
                      failures.append("pip-audit JSON did not contain a dependencies array")
                  else:
                      total = sum(
                          len(item.get("vulns", []))
                          for item in dependencies
                          if isinstance(item, dict)
                      )
                      if total:
                          failures.append(f"pip-audit findings: {total}")
              except (json.JSONDecodeError, TypeError) as exc:
                  failures.append(f"pip-audit JSON could not be parsed: {exc}")
          else:
              failures.append("pip-audit report is missing")

          summary = [
              f"npm audit exit code: {Path('npm-audit.exitcode').read_text().strip() if Path('npm-audit.exitcode').exists() else 'missing'}",
              f"pip-audit exit code: {Path('pip-audit.exitcode').read_text().strip() if Path('pip-audit.exitcode').exists() else 'missing'}",
          ]
          if failures:
              summary.extend(f"BLOCKING: {failure}" for failure in failures)
              Path("dependency-audit-summary.txt").write_text("\n".join(summary) + "\n")
              print("\n".join(summary))
              raise SystemExit(1)

          summary.append("Dependency release gate passed: no blocking findings detected.")
          Path("dependency-audit-summary.txt").write_text("\n".join(summary) + "\n")
          print("\n".join(summary))
          PY
      - name: Upload dependency audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: dermcareai-dependency-audit
          path: |
            npm-audit.json
            npm-audit.exitcode
            pip-audit.json
            pip-audit.exitcode
            dependency-audit-summary.txt

  mobile-sdk-57-candidate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dermcareai/package-lock.json
      - name: Install current mobile dependencies
        working-directory: dermcareai
        run: npm install --ignore-scripts
      - name: Align migration toolchain before SDK upgrade
        working-directory: dermcareai
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.dependencies['@react-native-async-storage/async-storage'] = '2.2.0';
          packageJson.dependencies['expo-splash-screen'] = '~57.0.9';
          packageJson.devDependencies['@react-native/babel-preset'] = '^0.86.3';
          packageJson.devDependencies['@types/react'] = '~19.2.4';
          packageJson.devDependencies['babel-preset-expo'] = '~57.0.0';
          packageJson.devDependencies.typescript = '~6.0.3';
          delete packageJson.overrides;
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');

          const appPath = 'app.json';
          const appConfig = JSON.parse(fs.readFileSync(appPath, 'utf8'));
          const expo = appConfig.expo;
          delete expo.splash;
          delete expo.newArchEnabled;
          expo.plugins = (expo.plugins || []).filter((plugin) => plugin !== 'expo-splash-screen');
          expo.plugins.push([
            'expo-splash-screen',
            {
              image: './src/assets/icons/splash-icon.png',
              resizeMode: 'contain',
              backgroundColor: '#ffffff'
            }
          ]);
          fs.writeFileSync(appPath, JSON.stringify(appConfig, null, 2) + '\n');
          NODE
      - name: Upgrade to stable Expo SDK 57 candidate
        working-directory: dermcareai
        run: npx expo install expo@^57.0.0 --fix
      - name: Run Expo Doctor
        working-directory: dermcareai
        run: npx expo-doctor
      - name: Generate runtime dependency audit
        working-directory: dermcareai
        run: npm audit --omit=dev --json > ../npm-audit-sdk57.json || true
      - name: Upload SDK 57 candidate
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: expo-sdk-57-migration-candidate
          path: |
            dermcareai/package.json
            dermcareai/package-lock.json
            dermcareai/app.json
            npm-audit-sdk57.json
