name: DermCareAI Firestore Rules

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firestore rules test dependencies
        working-directory: webapp
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.2 firebase-tools
      - name: Run Firestore emulator rules test
        working-directory: webapp
        run: npx firebase emulators:exec --project demo-dermcareai --only firestore "node scripts/firestore_rules.mjs"
