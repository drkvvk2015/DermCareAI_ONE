<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="1400" height="760" fill="#fbfcfe"/>
<text x="70" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#172033">DermCareAI — Clinical Encounter Workflow</text>
<text x="70" y="105" font-family="Arial" font-size="18" fill="#596579">The encounter is the central clinical record; AI is attached to it as reviewed decision support.</text>
<g font-family="Arial" font-size="18">
<g>
<rect x="80" y="170" width="210" height="100" rx="18" fill="#e8f0ff" stroke="#5b7bb2" stroke-width="2"/><text x="185" y="214" text-anchor="middle" font-weight="700">Patient 360</text><text x="185" y="244" text-anchor="middle">Select patient</text>
<rect x="340" y="170" width="210" height="100" rx="18" fill="#e9f7ef" stroke="#4b8f69" stroke-width="2"/><text x="445" y="214" text-anchor="middle" font-weight="700">Encounter</text><text x="445" y="244" text-anchor="middle">Open clinical note</text>
<rect x="600" y="170" width="210" height="100" rx="18" fill="#fff3df" stroke="#b7863b" stroke-width="2"/><text x="705" y="214" text-anchor="middle" font-weight="700">Exam</text><text x="705" y="244" text-anchor="middle">Structured dermatology</text>
<rect x="860" y="170" width="210" height="100" rx="18" fill="#f0eaff" stroke="#7d63aa" stroke-width="2"/><text x="965" y="214" text-anchor="middle" font-weight="700">Lesion</text><text x="965" y="244" text-anchor="middle">L-001 longitudinal ID</text>
<rect x="1120" y="170" width="210" height="100" rx="18" fill="#edf4ff" stroke="#5b7bb2" stroke-width="2"/><text x="1225" y="214" text-anchor="middle" font-weight="700">Assessment</text><text x="1225" y="244" text-anchor="middle">Differential + plan</text>
</g>
<g>
<path d="M290 220H340M550 220H600M810 220H860M1070 220H1120" stroke="#506070" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="170" y="390" width="250" height="110" rx="18" fill="#fff3df" stroke="#b7863b" stroke-width="2"/><text x="295" y="435" text-anchor="middle" font-weight="700">AI decision support</text><text x="295" y="465" text-anchor="middle">Attach result + provenance</text>
<rect x="470" y="390" width="250" height="110" rx="18" fill="#ffffff" stroke="#9aa7b8" stroke-width="2"/><text x="595" y="435" text-anchor="middle" font-weight="700">Clinician review</text><text x="595" y="465" text-anchor="middle">Accept / Reject / Override</text>
<rect x="770" y="390" width="250" height="110" rx="18" fill="#e9f7ef" stroke="#4b8f69" stroke-width="2"/><text x="895" y="435" text-anchor="middle" font-weight="700">Follow-up</text><text x="895" y="465" text-anchor="middle">Due date + instructions</text>
<rect x="1070" y="390" width="190" height="110" rx="18" fill="#e8f0ff" stroke="#5b7bb2" stroke-width="2"/><text x="1165" y="435" text-anchor="middle" font-weight="700">Sign-off</text><text x="1165" y="465" text-anchor="middle">Attested record</text>
<path d="M1225 270V330H295V390" fill="none" stroke="#9a6a32" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M420 445H470M720 445H770M1020 445H1070" stroke="#506070" stroke-width="4" marker-end="url(#arrow)"/>
</g>
<rect x="250" y="585" width="900" height="92" rx="18" fill="#f6eaea" stroke="#b45a5a" stroke-width="2"/>
<text x="700" y="625" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#7e3030">Safety rule</text>
<text x="700" y="654" text-anchor="middle" font-family="Arial" font-size="18" fill="#7e3030">An attached AI assessment must have an explicit clinician decision before final encounter sign-off.</text>
</g>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#506070"/></marker></defs>
</svg>