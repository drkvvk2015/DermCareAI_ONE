<rect x="900" y="650" width="540" height="112" rx="16" fill="#fff8e8" stroke="#c59a46" stroke-width="2"/>
<text x="1170" y="684" class="boxh" text-anchor="middle">Firestore authorization distinction</text>
<text x="1170" y="713" class="txt" text-anchor="middle">Rules govern direct client-SDK access.</text>
<text x="1170" y="740" class="txt" text-anchor="middle">Admin SDK bypasses Rules; FastAPI must authorize.</text>
<rect x="60" y="535" width="350" height="150" rx="18" fill="#fff3df" stroke="#b7863b" stroke-width="2"/>
<text x="235" y="573" class="boxh" text-anchor="middle">Clinical AI Governance</text>
<text x="235" y="605" class="txt" text-anchor="middle">Model identity • provenance</text>
<text x="235" y="633" class="txt" text-anchor="middle">Uncertainty • abstention</text>
<text x="235" y="661" class="txt" text-anchor="middle">Clinician review — physician final</text>
<path d="M900 300H760V610H410" class="dash"/>
<text x="680" y="592" class="small" text-anchor="middle">governed assistive integration</text>
<rect x="490" y="535" width="320" height="150" rx="18" fill="#f0eaff" stroke="#7d63aa" stroke-width="2"/>
<text x="650" y="573" class="boxh" text-anchor="middle">Cloudinary Object Storage</text>
