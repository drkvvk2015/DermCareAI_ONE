<text x="235" y="363" class="boxh" text-anchor="middle">Capacitor 8</text>
<text x="235" y="395" class="txt" text-anchor="middle">Android / iOS container</text>
<text x="235" y="423" class="small" text-anchor="middle">Packages the same webapp/ bundle</text>
<path d="M235 285V325" class="line"/>
<text x="255" y="310" class="small">same PWA</text>
<rect x="490" y="135" width="320" height="150" rx="18" fill="#fff3df" stroke="#b7863b" stroke-width="2"/>
<text x="650" y="171" class="boxh" text-anchor="middle">Firebase Authentication</text>
<text x="650" y="203" class="txt" text-anchor="middle">Clinician sign-in / identity</text>
<text x="650" y="231" class="txt" text-anchor="middle">Issues Firebase ID token</text>
<text x="650" y="258" class="small" text-anchor="middle">Identity provider — not an API proxy</text>
<path d="M410 205H490" class="line"/>
<text x="450" y="190" class="small" text-anchor="middle">sign in</text>
<path d="M490 250H410" class="dash"/>
<text x="450" y="270" class="small" text-anchor="middle">ID token</text>
<rect x="900" y="135" width="540" height="205" rx="18" fill="#e9f7ef" stroke="#4b8f69" stroke-width="2"/>
<text x="1170" y="173" class="boxh" text-anchor="middle">FastAPI /api/v1</text>
<text x="1170" y="207" class="txt" text-anchor="middle">Verify Firebase ID token (revocation check)</text>
<text x="1170" y="235" class="txt" text-anchor="middle">Role • organization • clinic • resource authorization</text>
<text x="1170" y="263" class="txt" text-anchor="middle">Clinical APIs • audit • consent • validation</text>
<text x="1170" y="304" class="small" text-anchor="middle">Client sends Authorization: Bearer &lt;ID token&gt;</text>
<path d="M810 210H900" class="line"/>
<text x="855" y="193" class="small" text-anchor="middle">HTTPS + token</text>
<rect x="900" y="410" width="340" height="205" rx="18" fill="#edf4ff" stroke="#6282b6" stroke-width="2"/>
<text x="1070" y="449" class="boxh" text-anchor="middle">PostgreSQL — production</text>
<text x="1070" y="483" class="txt" text-anchor="middle">Clinical SQL store</text>
