<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">DermCareAI current documented architecture</title>
<desc id="desc">The React and Vite PWA is the canonical client. Capacitor packages the same PWA bundle. The client obtains a Firebase ID token and sends it to FastAPI. FastAPI uses PostgreSQL for clinical workflow records, Firestore Admin SDK for the current patient registry creation path, and Cloudinary for signed upload authorization. AI governance is separate and clinician-final.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526173"/></marker>
  <style>
    .h{font:700 32px Arial,sans-serif;fill:#172033}
    .sub{font:16px Arial,sans-serif;fill:#526173}
    .boxh{font:700 19px Arial,sans-serif;fill:#172033}
    .txt{font:15px Arial,sans-serif;fill:#263449}
    .small{font:13px Arial,sans-serif;fill:#526173}
    .line{stroke:#526173;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .dash{stroke:#8a97a8;stroke-width:2;stroke-dasharray:7 6;fill:none}
  </style>
</defs>
