<text x="650" y="633" class="txt" text-anchor="middle">Backend signed-upload parameters</text>
<text x="650" y="661" class="small" text-anchor="middle">Not evidence of signed download URLs</text>
<path d="M900 275H850V610H810" class="line"/>
<text x="60" y="835" class="small">Architecture summary is based on the inspected repository source at the EGM integration baseline; the Firestore/PostgreSQL split remains an open architecture decision.</text>
