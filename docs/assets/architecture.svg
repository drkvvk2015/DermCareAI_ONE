<text x="60" y="88" class="sub">PWA + Capacitor • Firebase ID-token authentication • FastAPI authorization • hybrid persistence boundary</text>
<rect x="60" y="135" width="350" height="150" rx="18" fill="#e8f0ff" stroke="#5b7bb2" stroke-width="2"/>
<text x="235" y="170" class="boxh" text-anchor="middle">Canonical PWA Client</text>
