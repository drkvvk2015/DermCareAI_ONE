<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="1400" height="760" fill="#f8fafc"/>
<text x="70" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#172033">DermCareAI — AI Safety Boundary</text>
<text x="70" y="105" font-family="Arial" font-size="18" fill="#596579">AI output is traceable, can abstain, and cannot silently become a signed diagnosis.</text>
<rect x="80" y="160" width="260" height="120" rx="18" fill="#e8f0ff" stroke="#5b7bb2" stroke-width="2"/>
<text x="210" y="208" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Clinical image</text><text x="210" y="240" text-anchor="middle" font-family="Arial" font-size="18">Consent + quality gate</text>
<rect x="420" y="160" width="300" height="120" rx="18" fill="#fff3df" stroke="#b7863b" stroke-width="2"/>
<text x="570" y="208" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Model service</text><text x="570" y="240" text-anchor="middle" font-family="Arial" font-size="18">Provenance + threshold</text>
<rect x="800" y="160" width="250" height="120" rx="18" fill="#f6eaea" stroke="#b45a5a" stroke-width="2"/>
<text x="925" y="208" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Abstention</text><text x="925" y="240" text-anchor="middle" font-family="Arial" font-size="18">Uncertain / review</text>
<rect x="1130" y="160" width="200" height="120" rx="18" fill="#e9f7ef" stroke="#4b8f69" stroke-width="2"/>
<text x="1230" y="208" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Clinical record</text><text x="1230" y="240" text-anchor="middle" font-family="Arial" font-size="18">Encounter-linked</text>
<g stroke="#506070" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M340 220H420"/><path d="M720 220H800"/><path d="M1050 220H1130"/></g>
<rect x="190" y="375" width="1020" height="220" rx="24" fill="#ffffff" stroke="#9aa7b8" stroke-width="2"/>
<text x="700" y="420" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">Clinician review controls</text>
<rect x="250" y="460" width="220" height="80" rx="14" fill="#eef8f2"/><text x="360" y="510" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Accept</text>
<rect x="590" y="460" width="220" height="80" rx="14" fill="#fdf2f2"/><text x="700" y="510" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Reject</text>
<rect x="930" y="460" width="220" height="80" rx="14" fill="#fff7e8"/><text x="1040" y="510" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Override</text>
<text x="700" y="665" text-anchor="middle" font-family="Arial" font-size="18" fill="#596579">Pending AI reviews block final encounter sign-off • All review actions are audit-linked.</text>
</svg>