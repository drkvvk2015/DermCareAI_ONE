<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#f4f7fb"/><rect x="40" y="30" width="1000" height="1860" rx="52" fill="#fff" stroke="#d7e0ea" stroke-width="6"/>
<text x="90" y="120" font-family="Arial" font-size="30" font-weight="700" fill="#102a43">AI Screening • Clinician Review</text><text x="90" y="160" font-family="Arial" font-size="20" fill="#61758a">Safety-gated, provenance-aware decision support</text>
<rect x="80" y="220" width="430" height="430" rx="26" fill="#e9edf3"/><circle cx="295" cy="435" r="130" fill="#d6dee9"/><text x="145" y="690" font-family="Arial" font-size="18" fill="#61758a">Clinical image • consent linked</text>
<rect x="550" y="220" width="450" height="430" rx="26" fill="#eef7f1"/><text x="585" y="275" font-family="Arial" font-size="22" fill="#2f6b47">QUALITY GATE</text><text x="585" y="335" font-family="Arial" font-size="30" font-weight="700" fill="#102a43">Usable image</text><text x="585" y="390" font-family="Arial" font-size="20" fill="#61758a">Lighting ✓   Focus ✓   Size ✓</text><text x="585" y="455" font-family="Arial" font-size="22" fill="#61758a">Model provenance recorded</text><text x="585" y="520" font-family="Arial" font-size="22" fill="#61758a">Confidence threshold enforced</text>
<rect x="80" y="730" width="920" height="245" rx="28" fill="#102a43"/><text x="120" y="790" font-family="Arial" font-size="22" fill="#b9d8f2">DECISION SUPPORT</text><text x="120" y="850" font-family="Arial" font-size="38" font-weight="700" fill="#ffffff">Abstain / Risk signal / Review required</text><text x="120" y="905" font-family="Arial" font-size="18" fill="#dbe7f1">AI output is not a diagnosis. The clinician must explicitly Accept, Reject, or Override.</text>
<rect x="80" y="1035" width="920" height="150" rx="22" fill="#fff" stroke="#d7e0ea" stroke-width="4"/><text x="120" y="1095" font-family="Arial" font-size="24" font-weight="700" fill="#102a43">Audit trace</text><text x="120" y="1140" font-family="Arial" font-size="18" fill="#61758a">Request ID • model registry • provenance • clinician decision • override label</text>
<rect x="80" y="1245" width="280" height="90" rx="20" fill="#e8f1f8"/><text x="135" y="1302" font-family="Arial" font-size="22" font-weight="700" fill="#355c7d">ACCEPT</text>
<rect x="400" y="1245" width="280" height="90" rx="20" fill="#f4ecec"/><text x="470" y="1302" font-family="Arial" font-size="22" font-weight="700" fill="#7c4a4a">REJECT</text>
<rect x="720" y="1245" width="280" height="90" rx="20" fill="#f1f0e7"/><text x="790" y="1302" font-family="Arial" font-size="22" font-weight="700" fill="#766d43">OVERRIDE</text>
<text x="90" y="1800" font-family="Arial" font-size="17" fill="#7a8c9e">UI preview generated from the current repository screen architecture; not a device capture.</text>
</svg>